<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e12"><title>Музей Арктики — пространство</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080e12;color:#d6e0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #304049;gap:12px}.name{font:17px Georgia,serif;color:#cfb78e}.selection{display:flex;align-items:center;gap:10px}select{font:11px inherit;font-size:11px;color:#c7d9dc;background:#10232c;border:1px solid #3a515c;border-radius:3px;padding:6px 9px;max-width:230px}a{font-size:11px;color:#9db4be;text-decoration:none}a:focus-visible,select:focus-visible{outline:2px solid #7abec9;outline-offset:3px}iframe{border:0;width:100%;height:calc(100% - 42px);display:block}@media(max-width:600px){#camera{max-width:90px}#version{max-width:138px}.name{white-space:nowrap}.selection select{padding:5px}.bar{padding:0 12px}.name{font-size:14px}.selection{gap:7px}select{max-width:138px;font-size:10px}a{font-size:16px}a span{display:none}}</style></head><body><header class="bar"><span class="name">Ожившие архивы</span><div class="selection"><select id="camera" aria-label="Ракурс"><option value="tour">Пролёт</option><option value="free">Общий вид</option><option value="plan">Сверху</option></select><select id="version" aria-label="Версия пространства"><option value="v5">05 · Живой маршрут</option><optgroup label="Архив"><option value="v4">04 · Экспедиция</option><option value="v3">03 · Атмосфера</option><option value="v2">02 · Ожившие архивы</option><option value="v1">01 · Первая концепция</option><option value="space">Помещение</option></optgroup></select><a id="direct" href="../archives-v5/" target="_blank" rel="noopener"><span>Открыть отдельно </span>↗</a></div></header><iframe id="model" title="Экспедиционная концепция" src="../archives-v5/" allow="fullscreen; autoplay" allowfullscreen></iframe><script>const versions={v5:['../archives-v5/','Версия 5: живой маршрут'],v4:['../archives-v4/','Экспедиционная концепция'],v3:['../archives-v3/','Версия 3: атмосфера'],v2:['../archives-v2/','Версия 2: Ожившие архивы'],v1:['../archives/','Версия 1: первая концепция'],space:['../','Исходное помещение']};function show(id){if(!versions[id])id='v5';document.getElementById('version').value=id;document.getElementById('camera').hidden=id!=='v5';document.getElementById('model').src=versions[id][0];document.getElementById('model').title=versions[id][1];document.getElementById('direct').href=versions[id][0];history.replaceState(null,'','#'+id)}document.getElementById('version').onchange=e=>show(e.target.value);document.getElementById('camera').onchange=e=>document.getElementById('model').contentWindow.postMessage({type:'arctic-set-camera',mode:e.target.value},location.origin);window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===document.getElementById('model').contentWindow&&e.data?.type==='arctic-camera-state')document.getElementById('camera').value=e.data.mode;});if(location.hash)show(location.hash.slice(1));</script></body></html>
