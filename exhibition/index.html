<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 fill=%27%230e1a21%27/%3E%3Cpath d=%27M8 28L20 9L32 28Z%27 fill=%27%23d6bb8b%27/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e12"><title>Музей Арктики — версии пространства</title><style>html,body{margin:0;height:100%;background:#080e12;color:#d6e0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}.bar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #304049;gap:12px}.name{font:17px Georgia,serif;color:#cfb78e}.versions{display:flex;gap:5px}button{font:11px inherit;font-size:11px;background:none;border:1px solid transparent;color:#a1b3ba;padding:8px 13px;cursor:pointer;border-radius:20px}button[aria-pressed=true]{background:#213640;color:#dbe8e8;border-color:#3b5661}a{font-size:11px;color:#a8bcc1;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid #7abec9;outline-offset:3px}iframe{border:0;width:100%;height:calc(100% - 54px);display:block} @media(max-width:650px){.bar{height:82px;flex-wrap:wrap;padding:12px 14px;gap:8px}.name{font-size:15px}.versions{order:3;width:100%;justify-content:center;gap:2px}button{padding:6px 7px;font-size:10px}iframe{height:calc(100% - 82px)}}</style></head><body><header class="bar"><span class="name">Музей Арктики</span><nav class="versions" aria-label="Версии"><button data-version="v3" aria-pressed="true">03 · Атмосфера</button><button data-version="v2" aria-pressed="false">02 · Ожившие архивы</button><button data-version="v1" aria-pressed="false">01 · Первая концепция</button><button data-version="space" aria-pressed="false">Помещение</button></nav><a id="direct" href="../archives-v3/" target="_blank" rel="noopener">Открыть отдельно ↗</a></header><iframe id="model" title="Версия 3: Ожившие архивы" src="../archives-v3/"></iframe><script>const versions={v3:['../archives-v3/','Версия 3: Ожившие архивы'],v2:['../archives-v2/','Версия 2: Ожившие архивы'],v1:['../archives/','Версия 1: первая концепция'],space:['../','Исходная модель помещения']};function show(id){if(!versions[id])id='v3';document.getElementById('model').src=versions[id][0];document.getElementById('model').title=versions[id][1];document.getElementById('direct').href=versions[id][0];document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===id)));history.replaceState(null,'','#'+id)}document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>show(b.dataset.version));if(location.hash)show(location.hash.slice(1));</script></body></html>
